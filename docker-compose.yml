version: '3.8'

services:
  # MongoDB — replaces the previous Elasticsearch backend.
  # Pin to a recent stable LTS so docker-compose works the same locally
  # as on a fresh CI machine.
  mongo:
    image: mongo:7.0
    container_name: wardwatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # Local dev only — Atlas handles auth in production.
      - MONGO_INITDB_DATABASE=wardwatch
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Mongo Express — lightweight web UI for browsing collections
  # (replaces the old Kibana dashboard for local exploration).
  mongo-express:
    image: mongo-express:1.0.2
    container_name: wardwatch-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongo:
        condition: service_healthy

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: wardwatch-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=wardwatch
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: wardwatch-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongo_data:
    driver: local

networks:
  default:
    name: wardwatch-network
